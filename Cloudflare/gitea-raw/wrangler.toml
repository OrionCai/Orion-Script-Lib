name = "gitea-raw"
main = "worker.js"
compatibility_date = "2026-09-02"
keep_vars = true

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[vars]
GITEA_URL = "https://git.orionc.me"
GITEA_OWNER = "orion"
ALLOWED_REPOSITORIES = '["proxy","one-two_bubu_Ordering_System","ProxyConfSupport","RuleListSupport","script","filecodebox","FileCodeBoxFronted2026","FileCodeBoxFronted","FileCodeBoxFronted2023","plugin"]'

# Configure TOKEN and GITEA_TOKEN with `wrangler secret put`; never store them here.
